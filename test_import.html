<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Import JSON</title>
</head>
<body>
    <h1>Test Import JSON Feature</h1>
    
    <button id="testBtn">Test Import Button</button>
    <div id="result"></div>

    <script>
        // Test function $ helper
        const $ = id => document.getElementById(id);
        
        // Test modal exists
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Loaded');
            console.log('importJsonBtn element:', document.getElementById('importJsonBtn'));
            console.log('importJsonModal element:', document.getElementById('importJsonModal'));
            
            const testBtn = $('testBtn');
            if (testBtn) {
                testBtn.onclick = () => {
                    $('result').innerHTML = '<p style="color: green;">Button clicked! ✅</p>';
                    console.log('Test button clicked');
                };
            }
        });
    </script>
</body>
</html>
