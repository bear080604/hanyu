<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WenQing Chinese — Trang chủ</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=38">
  <!-- PWA / Add to Home Screen -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WenQing">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div id="page-main-content">
    <section class="app-section active" id="section-home">
      <div class="welcome-banner welcome-banner-with-logo">
        <div class="welcome-banner-text">
          <h1 id="welcomeUserText">Tổng quan học tập</h1>
          <p>Lộ trình ôn luyện từ vựng, ngữ âm và quy chuẩn nét chữ HSK 1–6.</p>
        </div>
        <div class="welcome-logo-wrap" title="Logo WenQing">
          <img src="logo-light.png" alt="Logo Sáng" class="welcome-logo-img logo-img-light">
          <img src="logo-dark.png" alt="Logo Tối" class="welcome-logo-img logo-img-dark">
        </div>
      </div>
      <div class="dashboard-grid">
        <div class="glass-card stat-highlight-card" style="max-width: 360px;">
          <div class="card-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z">
              </path>
            </svg>
          </div>
          <div class="card-info">
            <h3>Chuỗi ngày học</h3>
            <div class="value" id="userStreakVal">0 ngày</div>
            <p>Duy trì tần suất học đều đặn mỗi ngày</p>
          </div>
        </div>

        <a href="pages/arena.html" class="glass-card stat-highlight-card arena-banner-card"
          style="text-decoration: none; color: inherit; max-width: 360px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
          <div class="card-icon" style="background: rgba(192, 57, 43, 0.12); color: var(--color-primary, #c0392b);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
            </svg>
          </div>
          <div class="card-info">
            <div style="display:flex; align-items:center; gap:8px;">
              <h3 style="margin:0;">Đấu trường Kahoot</h3>
              <span
                style="font-size:0.68rem; font-weight:800; background:var(--color-primary, #c0392b); color:#fff; padding:2px 8px; border-radius:10px; letter-spacing:0.04em;">MỚI</span>
            </div>
            <div class="value" style="font-size:1.15rem; font-weight:800; color:var(--text-primary); margin-top:4px;">
              Thi đấu trực tiếp 🎮</div>
            <p>Quét mã QR cùng bạn bè thi phản xạ từ vựng!</p>
          </div>
        </a>
      </div>
      <h3 class="section-subtitle">Chương trình học HSK</h3>
      <div class="hsk-grid" id="homeHskGrid"></div>
    </section>
  </div>

  <!-- Modal Hồ sơ -->
  <div id="profileModal" class="modal" aria-modal="true" role="dialog" aria-label="Hồ sơ cá nhân">
    <div class="modal-content glass-card"
      style="max-width:480px; width:90%; max-height:85vh; overflow-y:auto; border-radius:16px; padding:28px; position:relative;">
      <button id="closeProfileModalBtn" class="icon-btn" style="position:absolute; top:16px; right:16px;"
        aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <h2 style="font-size:1.15rem; font-weight:600; color:var(--text-primary); margin-bottom:20px;">Hồ sơ cá nhân
      </h2>
      <div id="profileModalBody"></div>
    </div>
  </div>

  <!-- Custom Popup Overlay -->
  <div id="wqPopupOverlay" class="wq-popup-overlay" style="display: none;">
    <div class="wq-popup-card">
      <div id="wqPopupIcon" class="wq-popup-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <h3 id="wqPopupTitle" class="wq-popup-title">Thông báo</h3>
      <div id="wqPopupMessage" class="wq-popup-message"></div>
      <input type="text" id="wqPopupInput" class="auth-input wq-popup-input" style="display: none;"
        autocomplete="off" />
      <div id="wqPopupActions" class="wq-popup-actions"></div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="data/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="storage.js" defer></script>
  <script src="api-client.js" defer></script>
  <script src="profile.js" defer></script>
  <script src="js/shared.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/hanyu/sw.js');
    }
  </script>

</body>

</html>
